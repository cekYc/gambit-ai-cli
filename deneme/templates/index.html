<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Blog CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; max-width: 800px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4">Blog Yazılarım</h1>

    <!-- Yeni Yazı Ekleme Formu -->
    <div class="card card-body">
        <h5>Yeni Yazı Ekle</h5>
        <form action="/post/new" method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Başlık</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">İçerik</label>
                <textarea name="content" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Yayınla</button>
        </form>
    </div>

    <hr>

    <!-- Yazı Listesi -->
    {% for post in posts %}
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">{{ post.title }}</h2>
            <p class="card-text text-muted small">ID: {{ post.id }}</p>
            <p class="card-text">{{ post.content }}</p>
            
            <div class="d-flex justify-content-end gap-2">
                <!-- Düzenleme Modu (Basitlik için bir form ile yapıyoruz) -->
                <button class="btn btn-sm btn-warning" onclick="showEditModal({{ post.id }}, '{{ post.title | replace("'", "\\'") }}', '{{ post.content | replace("'", "\\'") }}')">Düzenle</button>
                
                <!-- Silme İşlemi -->
                <a href="/post/delete/{{ post.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Emin misiniz?')">Sil</a>
            </div>

            <!-- Düzenleme Formu (Gizli Modal Mantığı) -->
            <div id="edit-form-{{ post.id }}" style="display: none;" class="mt-3 border-top pt-3">
                <form action="/post/update/{{ post.id }}" method="POST">
                    <input type="hidden" name="title" id="edit-title-{{ post.id }}">
                    <textarea name="content" id="edit-content-{{ post.id }}" class="form-control mb-2"></textarea>
                    <button type="submit" class="btn btn-success btn-sm">Güncelle</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}

    {% if not posts %}
    <p class="text-center text-muted">Henüz hiç yazı yazılmamış.</p>
    {% endif %}
</div>

<!-- Basit bir JavaScript ile düzenleme alanını açıyoruz -->
<script>
function showEditModal(id, title, content) {
    const formDiv = document.getElementById('edit-form-' + id);
    const titleInput = document.getElementById('edit-title-' + id);
    const contentTextarea = document.getElementById('edit-content-' + id);

    // Kaçış karakterlerini temizleyerek veriyi yerleştiriyoruz
    titleInput.value = title;
    contentTextarea.value = content;
    
    formDiv.style.display = 'block';
}
</script>

</body>
</html>
