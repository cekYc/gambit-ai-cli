# Gambit: Ternary Bonsai 2.5 27B (Qwen3.8 27B), görsel modu (görsel eki yüklenir); ai-cli/lmstudio-hub/build.py üretir, elle değiştirme
model: gambit/ternary-bonsai-2.5-27b-vision
base:
  - key: prism-ml/ternary-bonsai-2.5-27b-gguf
    sources:
      - type: huggingface
        user: prism-ml
        repo: Ternary-Bonsai-2.5-27B-GGUF
config:
  load:
    fields:
      - key: llm.load.llama.argumentsOverride
        value:
          enabled: true
          disabledParameters: []
          overrideParameters: []
          excludeAllConfig: false
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
  - key: reasoningEffort
    displayName: Reasoning Effort
    description: xhigh is the most accurate; medium is shorter (low is not supported)
    type: select
    defaultValue: xhigh
    options:
      - value: medium
        label: Medium
      - value: xhigh
        label: Xhigh
    effects:
      - type: setJinjaVariable
        variable: reasoning_effort
metadataOverrides:
  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 27B
  contextLengths:
    - 262144
  vision: true
  reasoning: true
  trainedForToolUse: true
