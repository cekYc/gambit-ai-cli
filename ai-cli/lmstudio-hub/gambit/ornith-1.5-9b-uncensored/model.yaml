# Gambit: Ornith 1.5 9B sansürsüz, metin modu (görsel eki yüklenmez); ai-cli/lmstudio-hub/build.py üretir, elle değiştirme
model: gambit/ornith-1.5-9b-uncensored
base:
  - key: mradermacher/ornith-1.5-9b-uncensored-gguf
    sources:
      - type: huggingface
        user: mradermacher
        repo: Ornith-1.5-9B-uncensored-GGUF
config:
  load:
    fields:
      - key: llm.load.llama.argumentsOverride
        value:
          enabled: true
          disabledParameters:
            - "--mmproj"
          overrideParameters: []
          excludeAllConfig: false
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
metadataOverrides:
  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 9B
  contextLengths:
    - 262144
  vision: false
  reasoning: true
  trainedForToolUse: true
