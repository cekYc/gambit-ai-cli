# Gambit: Gemma 4 26B A4B QAT, metin modu (görsel eki yüklenmez); ai-cli/lmstudio-hub/build.py üretir, elle değiştirme
model: gambit/gemma-4-26b-a4b-qat
base:
  - key: lmstudio-community/gemma-4-26b-a4b-it-qat-gguf
    sources:
      - type: huggingface
        user: lmstudio-community
        repo: gemma-4-26B-A4B-it-QAT-GGUF
config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.topKSampling
        value: 64
      - key: llm.prediction.repeatPenalty
        value:
          checked: true
          value: 1
      - key: llm.prediction.reasoning.parsing
        value:
          enabled: true
          startString: "<|channel>thought"
          endString: "<channel|>"
  load:
    fields:
      - key: llm.load.llama.argumentsOverride
        value:
          enabled: true
          disabledParameters:
            - "--mmproj"
          overrideParameters: []
          excludeAllConfig: false
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
metadataOverrides:
  domain: llm
  architectures:
    - gemma4
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 26B
  contextLengths:
    - 262144
  vision: false
  reasoning: true
  trainedForToolUse: true
