# Gambit: Qwen3.5 9B Defiant Fable sansürsüz, metin modu (görsel eki yüklenmez); ai-cli/lmstudio-hub/build.py üretir, elle değiştirme
model: gambit/qwen3.5-9b-defiant-fable
base:
  - key: davidau/qwen3.5-9b-the-defiant-fable-uncensored-heretic-neo-imatrix-max-mtp-gguf
    sources:
      - type: huggingface
        user: DavidAU
        repo: Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF
config:
  load:
    fields:
      - key: llm.load.llama.argumentsOverride
        value:
          enabled: true
          disabledParameters:
            - "--mmproj"
          overrideParameters: []
          excludeAllConfig: false
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
metadataOverrides:
  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 9B
  contextLengths:
    - 262144
  vision: false
  reasoning: true
  trainedForToolUse: true
